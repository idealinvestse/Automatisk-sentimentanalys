data:
  import:
    enabled: true
    source: "s3://your-bucket/anonymized-calls/"   # eller lokal mapp / GDPR-safe endpoint
    pii_redaction: true
    retention_days: 90
  corpus:
    intent: "data/corpus/intent_v2.jsonl"
    sentiment: "data/corpus/sentiment_v2.jsonl"
    expanded_size_target: 5000   # målet för nightly expansion
  eval:
    nightly: true
    metrics: ["accuracy", "macro_f1", "llm_judge_score"]
    baseline_models: ["KBLab/robust-swedish-sentiment", "your-finetuned-model"]