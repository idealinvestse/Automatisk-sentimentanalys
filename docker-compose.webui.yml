# Fas 4 – Next.js web UI + FastAPI backend
#
# Usage:
#   1. Copy .env.example to .env and fill in real values
#   2. docker compose -f docker-compose.webui.yml up --build
#   Web UI:     http://localhost:3000
#   API docs:   http://localhost:8000/docs

services:
  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/cache/hf
      - app_outputs:/app/outputs
      - api_cache:/app/.cache
    env_file:
      - .env
    environment:
      - HF_HOME=/cache/hf
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webui:
    build:
      context: ./webui
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_USE_API_PROXY: "1"
    environment:
      - SENTIMENT_API_BASE_URL=http://api:8000
      - SENTIMENT_API_KEY=${SENTIMENT_API_KEY:-}
      - API_MAX_UPLOAD_SIZE_MB=${API_MAX_UPLOAD_SIZE_MB:-50}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf_cache:
  app_outputs:
  api_cache:
