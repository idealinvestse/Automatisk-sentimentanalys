# Fas 5 — Docker staging stack (production-like)
#
# Usage:
#   1. Copy .env.example to .env and set SENTIMENT_API_KEY (required)
#   2. docker compose -f docker-compose.staging.yml up --build
#   Web UI:     http://localhost:3000
#   API docs:   http://localhost:8000/docs
#   Prometheus: http://localhost:9090

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/cache/hf
      - app_outputs:/app/outputs
      - api_cache:/app/.cache
      - api_media:/app/media
      - api_state:/app/state
    env_file:
      - .env
    environment:
      - HF_HOME=/cache/hf
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - API_USE_REDIS_CACHE=true
      - REDIS_URL=redis://redis:6379/0
      - API_CACHE_DIR=/app/.cache
      - API_STATE_DIR=/app/state
      - SENTIMENT_JSON_LOGS=1
      - OTEL_ENABLED=true
      - API_PRODUCTION=true
      - API_REQUIRE_AUTH=true
      - API_REQUIRE_MEDIA_ROOT=true
      - SENTIMENT_API_KEY=${SENTIMENT_API_KEY:?Set SENTIMENT_API_KEY in .env}
      - API_MEDIA_ROOT=/app/media
      - API_RATE_LIMIT_RPM=${API_RATE_LIMIT_RPM:-120}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  webui:
    build:
      context: ./webui
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_USE_API_PROXY: "1"
    environment:
      - SENTIMENT_API_BASE_URL=http://api:8000
      - SENTIMENT_API_KEY=${SENTIMENT_API_KEY:?Set SENTIMENT_API_KEY in .env}
      - API_MAX_UPLOAD_SIZE_MB=${API_MAX_UPLOAD_SIZE_MB:-200}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docs/examples/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf_cache:
  app_outputs:
  api_cache:
  api_media:
  api_state:
