name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Ruff check
        run: ruff check src/ launcher/ tests/ scripts/ app/

      - name: Black check
        run: black --check src/ launcher/ tests/ scripts/ app/

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[min,cli,asr,install,dev,api]"

      - name: Run tests
        env:
          ANALYZER_VALIDATION_MODE: strict
        run: pytest tests/ -v --cov=src --cov-report=term --cov-fail-under=80

  api-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[min,asr,api,install,dev]"

      - name: API smoke (fast)
        run: pytest tests/test_api_smoke.py -q

      - name: API layer tests (≥90% coverage on src/api)
        run: |
          pytest \
            tests/test_api.py \
            tests/test_api_coverage.py \
            tests/test_api_services.py \
            tests/test_api_security.py \
            tests/test_api_upload.py \
            tests/test_scan_logic.py \
            tests/test_alerting_router.py \
            tests/test_transcription_jobs.py \
            tests/test_ws_ticket_minimal.py \
            tests/test_path_validation.py \
            tests/test_router_errors.py \
            tests/test_batch.py \
            tests/test_status_api.py \
            tests/contracts/test_api_error_contract.py \
            -q --cov=src/api --cov-report=term-missing --cov-fail-under=90

  docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t sentiment-api .

      - name: Validate staging compose config
        run: docker compose -f docker-compose.staging.yml config

  staging-smoke:
    needs: docker
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preference gate scaffold (skip when empty)
        run: python scripts/evaluate_preference_gate.py

      - name: Staging observability smoke (optional — requires running stack)
        run: python scripts/staging_observability_smoke.py --api-base http://localhost:8000
        continue-on-error: true

  mypy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[min,api,install,dev]"

      - name: Mypy (src)
        run: mypy src --config-file pyproject.toml

  webui:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify OpenAPI client paths
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

  finetune-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install training deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[training,min,dev]"

      - name: Fine-tune config and corpus tests
        run: pytest tests/test_finetune.py tests/test_train_intent.py tests/test_validate_intent_corpus.py -q

      - name: Validate domain corpus
        run: python scripts/validate_domain_corpus.py data/callcenter_val.csv --min-rows 500

      - name: Sentiment eval gate (heuristic smoke)
        run: python scripts/eval_sentiment_gate.py --backend heuristic --output reports/domain_eval_ci.json

  analyzer-accuracy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[training,min,cli,install,dev]"

      - name: Validate intent corpora
        run: |
          python scripts/validate_intent_corpus.py data/intent_train.jsonl --min-rows 200 --min-per-intent 20 --disjoint-from data/intent_val.jsonl
          python scripts/validate_intent_corpus.py data/intent_val.jsonl --min-rows 50 --min-per-intent 5

      - name: Benchmark intent (fixed val, macro F1 gate)
        run: |
          python scripts/benchmark_intent.py --val-file data/intent_val.jsonl --backend heuristic \
            --output reports/intent_baseline.json --min-macro-f1 0.75

      - name: Intent and DATA-01 workflow tests
        run: pytest tests/test_intent_model_backend.py tests/test_import_domain_corpus.py tests/test_quality_gate.py -q

      - name: Benchmark analyzers (fast heuristic sentiment)
        run: |
          python scripts/benchmark_analyzers.py --sentiment-backend heuristic \
            --output reports/analyzer_baseline.json --check-thresholds

      - name: Analyzer accuracy tests
        env:
          ANALYZER_VALIDATION_MODE: strict
        run: |
          pytest tests/test_analyzer_quality.py tests/test_analyzer_benchmarks.py -q