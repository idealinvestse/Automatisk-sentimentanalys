# Prometheus scrape config for Swedish Sentiment API.
#
# /metrics requires X-API-Key when SENTIMENT_API_KEY is set (not Bearer).
# Replace change-me with the same key as the API, or disable API auth in dev.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sentiment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    http_headers:
      X-API-Key:
        values:
          - "change-me"
