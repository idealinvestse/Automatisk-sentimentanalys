# Prometheus scrape config for Swedish Sentiment API.
#
# /metrics requires X-API-Key when SENTIMENT_API_KEY is set on the API.
# Set the header value below to match your API's SENTIMENT_API_KEY.
# If API_REQUIRE_AUTH is false or SENTIMENT_API_KEY is empty, X-API-Key is optional.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sentiment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    http_headers:
      X-API-Key:
        values:
          - "change-me"  # Set to match $SENTIMENT_API_KEY
